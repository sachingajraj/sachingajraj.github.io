<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku App</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 400px;
        }
        h1 {
            font-size: 32px;
            letter-spacing: 4px;
        }
        p {
            color: #aaa;
            margin: 20px 0;
        }
        a.button {
            display: inline-block;
            padding: 12px 20px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
        .clickable-app-image {
            /* Reduce size here */
            width: 200px;
            height: auto;

            border-radius: 15px;
            margin-top: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            transition: transform 0.2s ease;
        }

        .clickable-app-image:hover {
            transform: scale(1.05); /* Visual feedback that it's a link */
        }

        /* Remove the old .button styles if you want to clean up the code */
    </style>
</head>
<body>
    <div class="container">
        <a href="https://apps.apple.com/us/app/just-sudoku-classic-puzzle/id6762172260">
            <img src="assets/sudoku_v.png" alt="Download Sudoku on the App Store" class="clickable-app-image">
        </a>
    </div>
</body>
</html>
